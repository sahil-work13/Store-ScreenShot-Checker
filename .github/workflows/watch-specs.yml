name: Watch store specs

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-check
        run: node tests/check.test.mjs

      - name: Fetch spec pages
        id: watch
        run: node scripts/watch.mjs

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "Update spec page status" && git push)

      - name: Open an issue for each changed page
        if: steps.watch.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.watch.outputs.changed }}
        run: |
          IFS=',' read -ra STORES <<< "$CHANGED"
          for s in "${STORES[@]}"; do
            title="$s screenshot spec page changed"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body "The official $s screenshot spec page changed on $(date -u +%F). Check it, update rules.json, set verifiedOn to today, then close this issue. Links are in rules.json."
            fi
          done
